version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ascend_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: ascend_ml_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./ml-service/artifacts:/app/artifacts
      - ./ml-service/results:/app/results

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ascend_backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/ascend_ai
      - ML_SERVICE_URL=http://ml-service:8000
      - JWT_SECRET=ascend_ai_production_jwt_secret_2026_super_secure
    depends_on:
      - mongodb
      - ml-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ascend_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
